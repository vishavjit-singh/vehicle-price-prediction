[project]
name = "vehicle-price-prediction"
version = "2.0.0"
description = "Vehicle listing price prediction with a single scikit-learn pipeline."
authors = [{ name = "Vishavjit Singh Saini" }]
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
